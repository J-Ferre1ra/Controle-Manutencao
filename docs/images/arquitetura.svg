<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="660" viewBox="0 0 1440 660" role="img" aria-labelledby="title desc">
  <title id="title">Arquitetura do Controle de Execução de Ordens</title>
  <desc id="desc">Equipe e supervisor usam o navegador React. A API Cloudflare Worker autentica e consulta o banco D1 e os arquivos estáticos. Mudanças geram avisos via Durable Object e WebSocket.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fbfc"/><stop offset="1" stop-color="#eaf3f5"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#164253" flood-opacity=".10"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 11 6 1 11" fill="none" stroke="#1786a2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 11 6 1 11" fill="none" stroke="#00a859" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#073b56}.subtitle{font:400 17px Arial,sans-serif;fill:#55717b}.card{fill:#fff;stroke:#d8e6e9;stroke-width:2;rx:22;filter:url(#shadow)}.card-title{font:700 24px Arial,sans-serif;fill:#073b56}.copy{font:400 17px Arial,sans-serif;fill:#55717b}.tag{font:700 14px Arial,sans-serif;letter-spacing:.08em;fill:#078f58}.path{fill:none;stroke:#1786a2;stroke-width:4;marker-end:url(#arrow)}.live{fill:none;stroke:#00a859;stroke-width:3;stroke-dasharray:10 9;marker-end:url(#arrowGreen)}.hint{font:700 14px Arial,sans-serif;fill:#1786a2}.hint-green{font:700 14px Arial,sans-serif;fill:#00864c}.icon{fill:#e7f5f0;stroke:#00a859;stroke-width:2}
    </style>
  </defs>
  <rect width="1440" height="660" rx="28" fill="url(#bg)"/>
  <text x="64" y="74" class="title">Uma aplicação, com acesso controlado no servidor</text>
  <text x="64" y="108" class="subtitle">A tela organiza o trabalho; o Worker aplica as permissões e persiste os registros no D1.</text>

  <rect class="card" x="60" y="190" width="285" height="250"/>
  <circle class="icon" cx="202" cy="253" r="32"/><path d="M184 250h36M184 261h36M190 239h24" stroke="#008c54" stroke-width="4" stroke-linecap="round"/>
  <text x="202" y="322" class="card-title" text-anchor="middle">Pessoa usuária</text>
  <text x="202" y="354" class="copy" text-anchor="middle">Equipe ou supervisão</text>
  <text x="202" y="384" class="copy" text-anchor="middle">Celular · tablet · computador</text>

  <rect class="card" x="450" y="160" width="335" height="310"/>
  <rect x="480" y="191" width="275" height="50" rx="14" fill="#e8f4f6"/>
  <text x="617" y="222" class="tag" text-anchor="middle">FRONT-END</text>
  <text x="617" y="292" class="card-title" text-anchor="middle">Navegador</text>
  <text x="617" y="325" class="copy" text-anchor="middle">React · TypeScript · CSS</text>
  <text x="617" y="357" class="copy" text-anchor="middle">Formulários e telas responsivas</text>
  <text x="617" y="389" class="copy" text-anchor="middle">Dados filtrados por perfil</text>
  <text x="617" y="436" class="hint" text-anchor="middle">Workers Assets</text>

  <rect class="card" x="890" y="160" width="320" height="310"/>
  <rect x="921" y="191" width="258" height="50" rx="14" fill="#e8f4f6"/>
  <text x="1050" y="222" class="tag" text-anchor="middle">API E REGRAS DE NEGÓCIO</text>
  <text x="1050" y="292" class="card-title" text-anchor="middle">Cloudflare Worker</text>
  <text x="1050" y="325" class="copy" text-anchor="middle">Autentica e autoriza</text>
  <text x="1050" y="357" class="copy" text-anchor="middle">Valida ordens e perfis</text>
  <text x="1050" y="389" class="copy" text-anchor="middle">Grava protocolo e histórico</text>
  <text x="1050" y="436" class="hint" text-anchor="middle">HTTPS · /api</text>

  <rect class="card" x="1260" y="190" width="130" height="250"/>
  <ellipse cx="1325" cy="255" rx="40" ry="15" fill="#e8f4f6" stroke="#1786a2" stroke-width="2"/>
  <path d="M1285 255v45c0 9 18 16 40 16s40-7 40-16v-45M1285 278c0 9 18 16 40 16s40-7 40-16" fill="#e8f4f6" stroke="#1786a2" stroke-width="2"/>
  <text x="1325" y="357" class="card-title" text-anchor="middle">D1</text>
  <text x="1325" y="386" class="copy" text-anchor="middle">Ordens</text>
  <text x="1325" y="411" class="copy" text-anchor="middle">e protocolos</text>

  <path class="path" d="M346 314h90"/><text x="389" y="296" class="hint" text-anchor="middle">HTTPS</text>
  <path class="path" d="M786 314h90"/><text x="831" y="296" class="hint" text-anchor="middle">API</text>
  <path class="path" d="M1210 314h40"/>

  <rect x="450" y="515" width="760" height="92" rx="20" fill="#f5fbf8" stroke="#ccebdd" stroke-width="2"/>
  <circle cx="500" cy="561" r="22" fill="#e2f5eb" stroke="#00a859" stroke-width="2"/><path d="M489 561h22m-11-11v22" stroke="#008b50" stroke-width="3" stroke-linecap="round"/>
  <text x="540" y="552" class="card-title">Durable Object + WebSocket</text>
  <text x="540" y="581" class="copy">Publica um aviso de atualização; cada navegador consulta a API autorizada.</text>
  <path class="live" d="M1050 471v38"/><path class="live" d="M450 561h-72v-247h55"/>
  <text x="1230" y="558" class="hint-green">Aviso</text>
</svg>
